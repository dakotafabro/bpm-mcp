[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpm-mcp"
version = "0.1.0"
description = "MCP server for BPM - discover, inspect, and install behavioral packages from within agent sessions"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.27.0",
]

[project.scripts]
bpm-mcp = "bpm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpm_mcp"]
